    <script>
      (() => {
        try {
          const k = "vueuse-color-scheme";
          const s = localStorage.getItem(k);
          const prefersDark = matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;
          const d = s ? s : prefersDark ? "dark" : "light";
          const root = document.documentElement;
          root.classList.remove("dark", "latex-dark", "latex-dark-auto");
          if (d === "dark") root.classList.add("dark", "latex-dark");
          else if (d === "auto") {
            if (prefersDark) root.classList.add("dark");
            root.classList.add("latex-dark-auto");
          }
          console.log("[theme/bootstrap] resolved", { stored: s, applied: d });
        } catch (e) {
          console.warn("[theme/bootstrap] error", e);
        }
      })();
      window.NUANCE_CTX = {
        HTTP_HOST: "http://nuance.localdys.com:5174",
        WHITELABEL: false,
        SCRIPT_NAME: "nuance.dys",
      };
    </script>
